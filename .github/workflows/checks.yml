name: Checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-gift-sample.mjs
      - run: node scripts/check-telegram-catalog.mjs
      - run: node scripts/check-wallet.mjs
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: pip install -r backend/requirements-telegram.txt
      - run: python -m pytest backend/tests -q
        env:
          GIFT_TEST_POSTGRES_URL: postgresql+psycopg://auth_test:ci_only_test_password@localhost:5432/auth_test
